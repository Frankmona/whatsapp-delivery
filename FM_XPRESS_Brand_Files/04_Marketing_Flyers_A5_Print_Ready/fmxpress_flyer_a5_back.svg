    </g>

    <!-- ==================== 3. TRANSPARENT PRICING SECTION ==================== -->
    <g transform="translate(0, 500)">
      <rect width="1609" height="340" rx="34" fill="#0F172A" stroke="#10B981" stroke-opacity="0.3" stroke-width="2"/>
      
      <!-- Section Header -->
