      <rect x="350" y="320" width="90" height="90" fill="#10B981" rx="15"/>
      <rect x="480" y="320" width="90" height="90" fill="#10B981" rx="15"/>
      <rect x="610" y="320" width="90" height="90" fill="#10B981" rx="15"/>

      <rect x="360" y="450" width="60" height="60" fill="#0F172A"/>
      <rect x="470" y="450" width="80" height="60" fill="#0F172A"/>
      <rect x="620" y="450" width="60" height="60" fill="#0F172A"/>
      <rect x="360" y="560" width="70" height="60" fill="#0F172A"/>
      <rect x="480" y="560" width="70" height="60" fill="#0F172A"/>
      <rect x="600" y="560" width="60" height="60" fill="#0F172A"/>
