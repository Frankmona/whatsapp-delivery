        <rect x="582" y="0" width="28" height="230" fill="#0F172A"/>
        <rect x="624" y="0" width="40" height="230" fill="#0F172A"/>
        <rect x="678" y="0" width="14" height="230" fill="#0F172A"/>
        <rect x="706" y="0" width="32" height="230" fill="#0F172A"/>
