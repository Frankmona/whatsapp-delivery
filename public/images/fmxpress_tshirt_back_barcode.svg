        <rect x="70" y="0" width="14" height="230" fill="#0F172A"/>
        <rect x="98" y="0" width="34" height="230" fill="#0F172A"/>
        <rect x="146" y="0" width="14" height="230" fill="#0F172A"/>
        <rect x="174" y="0" width="42" height="230" fill="#0F172A"/>
        <rect x="230" y="0" width="18" height="230" fill="#0F172A"/>
        <rect x="262" y="0" width="32" height="230" fill="#0F172A"/>
        <rect x="308" y="0" width="12" height="230" fill="#0F172A"/>
        <rect x="334" y="0" width="40" height="230" fill="#0F172A"/>
        <rect x="388" y="0" width="20" height="230" fill="#0F172A"/>
        <rect x="422" y="0" width="28" height="230" fill="#0F172A"/>
        <rect x="464" y="0" width="14" height="230" fill="#0F172A"/>
        <rect x="492" y="0" width="46" height="230" fill="#0F172A"/>
