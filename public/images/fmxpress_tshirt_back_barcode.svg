      <rect x="470" y="90" width="70" height="60" fill="#0F172A"/>
      <rect x="580" y="90" width="60" height="60" fill="#0F172A"/>
      <rect x="680" y="90" width="60" height="60" fill="#0F172A"/>
      <rect x="360" y="190" width="70" height="60" fill="#0F172A"/>
      <rect x="480" y="190" width="60" height="60" fill="#0F172A"/>
      <rect x="630" y="190" width="70" height="60" fill="#0F172A"/>
      
