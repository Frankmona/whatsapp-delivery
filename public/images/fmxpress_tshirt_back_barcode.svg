    <!-- White Card Container for QR + Barcode -->
    <g transform="translate(-550, 200)">
      <rect width="1100" height="1350" rx="90" fill="#FFFFFF"/>
      
      <!-- QR CODE (Finder Patterns & Matrix) -->
      <!-- Top Left Finder -->
      <rect x="100" y="90" width="210" height="210" fill="#0F172A" rx="25"/>
      <rect x="135" y="125" width="140" height="140" fill="#FFFFFF" rx="15"/>
      <rect x="165" y="155" width="80" height="80" fill="#0F172A" rx="10"/>

      <!-- Top Right Finder -->
      <rect x="790" y="90" width="210" height="210" fill="#0F172A" rx="25"/>
      <rect x="825" y="125" width="140" height="140" fill="#FFFFFF" rx="15"/>
      <rect x="855" y="155" width="80" height="80" fill="#0F172A" rx="10"/>

      <!-- Bottom Left Finder -->
      <rect x="100" y="570" width="210" height="210" fill="#0F172A" rx="25"/>
      <rect x="135" y="605" width="140" height="140" fill="#FFFFFF" rx="15"/>
      <rect x="165" y="635" width="80" height="80" fill="#0F172A" rx="10"/>

      <!-- QR Pattern Elements -->
