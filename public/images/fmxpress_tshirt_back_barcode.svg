<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3200" viewBox="0 0 2400 3200">
  <g transform="translate(1200, 360)" text-anchor="middle">
    <!-- Top FM XPRESS Brand -->
    <text y="0" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="190" letter-spacing="-4">
      <tspan fill="#FFFFFF">FM</tspan>
